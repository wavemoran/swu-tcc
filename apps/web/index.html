<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SWU TCC · Top Cut Calculator</title>
    <meta name="description" content="Can you make top cut, and can you safely intentionally draw (ID)? A fan-made Star Wars: Unlimited top cut calculator." />
    <meta name="theme-color" content="#08080D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- TODO: export PNGs from app-icon.svg (180x180 apple-touch-icon.png; 192 and 512 for the manifest). -->
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      try {
        var t = localStorage.getItem('swu-tcc:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
